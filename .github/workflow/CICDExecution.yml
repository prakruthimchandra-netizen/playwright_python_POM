on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      #1 Checkout the repository
      name: Checkout the repository
      uses: actions/checkout@v3

      #2 Set up Python versions
      name: Set up Python 
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

      #3 Install dependencies 
      name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install allure-pytest
        playwright install --with-deps

      #4 run playwright tests (parallel, keep artifacts)
      name: Run Playwright tests
      run: |
        pytest -n 6 -s\
          --alluredir=allure-results \
          --capture=tee-sys 
      continue-on-error: true

      #5 Verify allure results(DEBUG safety)
      name: Verify allure results
      run: |
        echo "Listing allure-results contents:"
        ls -la allure-results || echo "No allure-results directory found."

      #6 Install allure CLI i
      name: Install Allure CLI
      if: always()
      run: |
        sudo apt-get update
        sudo apt-get install -y unzip wget
        wget https://github.com/allure-framework/allure2/releases/download/2.13.8/allure-2.13.8.zip
        unzip allure-2.13.8.zip
        sudo mv allure-2.13.8 /opt/allure 
        sudo ln -s /opt/allure/bin/allure /usr/bin/allure
        allure --version